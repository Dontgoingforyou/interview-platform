name: Проверки

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-lint:
    name: линт бэкенда
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python
      - run: make lint
      - run: make typecheck
        env:
          DJANGO_TESTING: "1"
          SECRET_KEY: test-secret-key

  backend-test:
    name: тесты бэкенда
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python
      - run: make test
        env:
          DJANGO_TESTING: "1"
          DISABLE_VECTOR_SIGNALS: "1"
          SECRET_KEY: test-secret-key

  frontend-lint:
    name: линт фронтенда
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: project/frontend/package-lock.json
      - run: npm ci
        working-directory: project/frontend
      - run: make lint-frontend

  frontend-test:
    name: тесты фронтенда
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: project/frontend/package-lock.json
      - run: npm ci
        working-directory: project/frontend
      - run: make test-frontend
