openapi: 3.0.3
info:
  title: Платформа собеседований API
  version: 1.0.0
  description: |-
    API для управления студентами, собеседованиями, офферами и долгами.

    **Аутентификация:** сессия локального входа.
    Демо-учётки: admin / manager / student.
paths:
  /mcp:
    post:
      operationId: http_mcp
      summary: HTTP MCP
      description: |-
        JSON-RPC 2.0 (`initialize`, `tools/list`, `tools/call`).
        Клиент передаёт сессию локального входа.

        Набор тулов: собеседования (list/get/create/update, база, транскрипции),
        студенты, компании, направления, «Грустят», сотрудники, менеджеры,
        разработчики, база знаний, семантический поиск.
        Офферы, долги, KPI и отчёт разработчиков — только администратор.
        Ментор видит базу собеседований и транскрипции.
        Права тулов совпадают с REST API.
        Матрица: `docs/product/mcp-roles-pages.html`.
      tags:
      - MCP
      security:
      - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: JSON-RPC result или error
        '401':
          description: Нет сессии
        '403':
          description: Роль без доступа к MCP
  /api/analytics/debts/:
    get:
      operationId: analytics_debts_retrieve
      description: |-
        Аналитика долгов — тот же payload, что у compute_debt_analytics().
        Ключ кэша совместим с legacy debt_analytics_api при пустых GET-параметрах.
      summary: Аналитика по долгам
      tags:
      - Аналитика
      security:
      - SessionAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/developers/:
    get:
      operationId: analytics_developers_retrieve
      description: Аналитика по разработчикам (метрики, график по месяцам, подсказки).
      summary: Аналитика по разработчикам
      tags:
      - Аналитика
      security:
      - SessionAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/directions/:
    get:
      operationId: analytics_directions_retrieve
      description: |-
        Агрегаты по собеседованиям по направлениям.

        **Параметры:** `date_filter` (YYYY-MM-DD), `direction` (id), `min_conversion` (%).
      summary: Аналитика по направлениям
      tags:
      - Направления
      security:
      - SessionAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/interviews/:
    get:
      operationId: analytics_interviews_retrieve
      description: |-
        Аналитика собеседований (метрики за 30 дней и за всё время).

        Ключ кэша совпадает с legacy interview_analytics_api для тех же GET-параметров.
      summary: Аналитика по собеседованиям
      tags:
      - Аналитика
      security:
      - SessionAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/interviews/type-breakdown/:
    get:
      operationId: analytics_interviews_type_breakdown_retrieve
      description: Статистика по типам для текущих фильтров списка собеседований.
      summary: Разбивка собеседований по типам
      tags:
      - Аналитика
      security:
      - SessionAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/managers/:
    get:
      operationId: analytics_managers_retrieve
      description: KPI по менеджерам (те же данные, что у compute_managers_analytics).
      summary: Аналитика команды менеджеров
      tags:
      - Менеджеры
      security:
      - SessionAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/managers/observations/:
    get:
      operationId: analytics_managers_observations_retrieve
      description: Агрегаты для текстовых инсайтов (список по менеджерам, лидеры и
        т.д.).
      summary: Наблюдения по менеджерам
      tags:
      - Менеджеры
      security:
      - SessionAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/managers/table/:
    get:
      operationId: analytics_managers_table_retrieve
      description: 'Строки таблицы «Менеджеры»: кандидаты, интервью, направления,
        даты.'
      summary: Таблица менеджеров дашборда
      tags:
      - Менеджеры
      security:
      - SessionAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/offers/:
    get:
      operationId: analytics_offers_retrieve
      description: |-
        Аналитика офферов для SPA.
        Ключ кэша совместим с legacy offer_analytics_api при пустых GET-параметрах.
      summary: Аналитика по офферам
      tags:
      - Аналитика
      security:
      - SessionAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/sad-intern/:
    get:
      operationId: analytics_sad_intern_retrieve
      description: Метрики списка ожидания (грустящие студенты).
      summary: Аналитика по «грустящим» студентам
      tags:
      - Аналитика
      security:
      - SessionAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      summary: Локальный вход
      description: Логин и пароль демо-учётки. Успешный ответ ставит сессионную куку.
      tags:
      - Авторизация
      security:
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Пользователь и сессия
        '401':
          description: Неверные учётные данные
  /api/companies/:
    get:
      operationId: companies_list
      description: |-
        Пагинированный список.

        **Фильтры:** `q`, `is_bigtech` (true/false), `bigtech=1` (только бигтех).
        **Сортировка:** `sort` — interviews, -interviews, name, -name (по умолчанию interviews).
      summary: Список компаний
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Компании
      security:
      - SessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCompanyList'
          description: ''
    post:
      operationId: companies_create
      description: 'CRUD компаний: чтение — менеджеры/HR/outstaff; запись — менеджеры
        и админ; удаление — только админ.'
      summary: Создать компанию
      tags:
      - Компании
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompanyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompanyRequest'
        required: true
      security:
      - SessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
  /api/companies/{id}/:
    get:
      operationId: companies_retrieve
      description: 'CRUD компаний: чтение — менеджеры/HR/outstaff; запись — менеджеры
        и админ; удаление — только админ.'
      summary: Детали компании
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Компания.
        required: true
      tags:
      - Компании
      security:
      - SessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
    put:
      operationId: companies_update
      description: 'CRUD компаний: чтение — менеджеры/HR/outstaff; запись — менеджеры
        и админ; удаление — только админ.'
      summary: Изменить компанию
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Компания.
        required: true
      tags:
      - Компании
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompanyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompanyRequest'
        required: true
      security:
      - SessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
    patch:
      operationId: companies_partial_update
      description: 'CRUD компаний: чтение — менеджеры/HR/outstaff; запись — менеджеры
        и админ; удаление — только админ.'
      summary: Частично изменить компанию
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Компания.
        required: true
      tags:
      - Компании
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCompanyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCompanyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCompanyRequest'
      security:
      - SessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
    delete:
      operationId: companies_destroy
      description: Только администратор. Нельзя удалить компанию со связанными собеседованиями.
      summary: Удалить компанию
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Компания.
        required: true
      tags:
      - Компании
      security:
      - SessionAuth: []
      responses:
        '204':
          description: Удалено
        '409':
          description: Конфликт
  /api/companies/merge/:
    post:
      operationId: companies_merge_create
      description: Перенос собеседований на главную, слияние псевдонимов, удаление
        дублей.
      summary: Объединить компании
      tags:
      - Компании
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyMergeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompanyMergeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompanyMergeRequest'
        required: true
      security:
      - SessionAuth: []
      responses:
        '200':
          description: Успех
        '400':
          description: Ошибка валидации
  /api/companies/stats/:
    get:
      operationId: companies_stats_retrieve
      description: 'Сводные числа: всего, бигтех, с/без собеседований.'
      summary: Статистика по компаниям
      tags:
      - Компании
      security:
      - SessionAuth: []
      responses:
        '200':
          description: OK
  /api/debts/:
    get:
      operationId: debts_list
      description: |-
        Список долгов студентов с пагинацией (page, page_size).

        Менеджер видит долги только своих студентов.

        **Фильтры:** `q` или `search`, `direction`, `payment_status`, `intern_id`, `not_paid_filter=3months`, `act_date_filter`, `act_date_from`, `act_date_to`; сортировка `order_by`, `order_dir`.
      summary: Список долгов
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Долги
      security:
      - cookieAuth: []
      - SessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDebtListList'
          description: ''
    post:
      operationId: debts_create
      description: Создаёт новую запись о долге студента. Только для администраторов.
      summary: Создать долг
      tags:
      - Долги
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebtCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DebtCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DebtCreateUpdateRequest'
        required: true
      security:
      - cookieAuth: []
      - SessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtCreateUpdate'
          description: ''
  /api/debts/{id}/:
    get:
      operationId: debts_retrieve
      description: Возвращает полную информацию о долге, включая историю платежей.
      summary: Детали долга
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Долги
      security:
      - cookieAuth: []
      - SessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtDetail'
          description: ''
    put:
      operationId: debts_update
      description: Полное обновление записи о долге. Только для администраторов.
      summary: Обновить долг (PUT)
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Долги
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebtCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DebtCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DebtCreateUpdateRequest'
        required: true
      security:
      - cookieAuth: []
      - SessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtCreateUpdate'
          description: ''
    patch:
      operationId: debts_partial_update
      description: Частичное обновление записи о долге. Только для администраторов.
      summary: Обновить долг
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Долги
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDebtCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDebtCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDebtCreateUpdateRequest'
      security:
      - cookieAuth: []
      - SessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtCreateUpdate'
          description: ''
    delete:
      operationId: debts_destroy
      description: Удаление записи о долге. Только для администраторов.
      summary: Удалить долг
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Долги
      security:
      - cookieAuth: []
      - SessionAuth: []
      responses:
        '204':
          description: No response body
  /api/debts/{id}/add-payment/:
    post:
      operationId: debts_add_payment_create
      description: Добавляет запись о платеже в историю долга. Только для администраторов.
      summary: Добавить платёж
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Долги
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentHistoryCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentHistoryCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentHistoryCreateRequest'
        required: true
      security:
      - cookieAuth: []
      - SessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtList'
          description: ''
  /api/debts/by-month/:
    get:
      operationId: debts_by_month_retrieve
      description: 'Отчёт по платежам за период. Обязательны `month_from`, `year_from`,
        `month_to`, `year_to`. Опционально `payment_status_filter`: paying | not_paying
        | paid_fully.'
      summary: Долги по месяцам
      tags:
      - Долги
      security:
      - cookieAuth: []
      - SessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtByMonthRow'
          description: ''
  /api/debts/import/:
    post:
      operationId: debts_import_create
      description: Загрузка CSV/XLSX, постановка Celery-задачи. Только администратор.
      summary: Импорт долгов из файла
      tags:
      - Долги
      security:
      - SessionAuth: []
      responses:
        '200':
          description: No response body
  /api/developers/:
    get:
      operationId: developers_list
      description: |-
        Пагинированный список специалистов с агрегированной статистикой.

        **Фильтры:** `direction_id` или `direction`, `q` (ФИО).
        **Сортировка:** `order_by`, `order_dir` (asc|desc).
      summary: Статистика по разработчикам
      parameters:
      - in: query
        name: direction
        schema:
          type: integer
        description: Синоним direction_id
      - in: query
        name: direction_id
        schema:
          type: integer
        description: Фильтр по направлению
      - in: query
        name: order_by
        schema:
          type: string
        description: Поле сортировки
      - in: query
        name: order_dir
        schema:
          type: string
        description: asc или desc
      - in: query
        name: page
        schema:
          type: integer
        description: Номер страницы
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Поиск по ФИО
      tags:
      - Разработчики
      security:
      - SessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDeveloperStatList'
          description: ''
  /api/directions/:
    get:
      operationId: directions_list
      description: |-
        Возвращает список направлений.

        **Фильтр:** `q` — поиск по названию.
      summary: Список направлений
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Направления
      security:
      - cookieAuth: []
      - SessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDirectionList'
          description: ''
    post:
      operationId: directions_create
      description: Доступно только администраторам.
      summary: Создать направление
      tags:
      - Направления
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DirectionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DirectionRequest'
        required: true
      security:
      - cookieAuth: []
      - SessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Direction'
          description: ''
  /api/directions/{id}/:
    get:
      operationId: directions_retrieve
      description: Возвращает информацию о направлении по id.
      summary: Детали направления
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Направление.
        required: true
      tags:
      - Направления
      security:
      - cookieAuth: []
      - SessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Direction'
          description: ''
  /api/docs/:
    get:
      operationId: docs_retrieve
      description: |-
        Swagger UI для менеджеров и администраторов.

        Студенты портала получают 403.
        Незалогиненные пользователи перенаправляются на страницу локального входа.

        authentication_classes содержат DRF-слой аутентификации (defense-in-depth).
        permission_classes = [] — намеренно: кастомный get() реализует редирект на логин
        вместо стандартного DRF 403, что даёт лучший UX для браузерных пользователей.
      summary: Интерактивная документация (Swagger UI)
      tags:
      - Документация API
      security:
      - SessionAuth: []
      responses:
        '200':
          description: No response body
  /api/employees/admin/developers/:
    get:
      operationId: employees_admin_developers_retrieve
      description: |-
        Возвращает список менеджеров с количеством активных студентов и списком студентов.

        **Параметр:** show_hidden=1 — включить неактивных менеджеров.
      summary: Количество разработчиков по менеджерам
      parameters:
      - in: query
        name: show_hidden
        schema:
          type: boolean
          default: false
        description: Включить неактивных менеджеров
      tags:
