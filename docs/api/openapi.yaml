        Уникальные пары (год, месяц) с количеством офферов, по убыванию периода.

        Те же фильтры, что у списка (`search`/`q`, `intern_id`, `direction_id`, `year`, `month`).
        Пагинация окон: `offset` (по умолчанию 0), `limit` (по умолчанию 3, макс. 50).
