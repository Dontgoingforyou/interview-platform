    SemanticSearchRequestRequest:
      type: object
      description: Сериализатор запроса для семантического поиска.
      properties:
        query:
          type: string
          minLength: 1
          description: Поисковый запрос на естественном языке
        entity_type:
          nullable: true
          description: |-
            Фильтр по типу сущности

            * `interview` - interview
            * `intern` - intern
            * `offer` - offer
            * `debt` - debt
            * `sad_intern` - sad_intern
            * `manager` - manager
            * `company` - company
            * `direction` - direction
            * `intern_weekly_status` - intern_weekly_status
            * `kb_article` - kb_article
          oneOf:
          - $ref: '#/components/schemas/EntityTypeEnum'
          - $ref: '#/components/schemas/NullEnum'
        top_k:
          type: integer
          maximum: 100
          minimum: 1
          description: 'Количество результатов (по умолчанию: 10)'
        min_score:
          type: number
          format: double
          maximum: 1.0
          minimum: 0.0
          description: 'Минимальный score схожести (по умолчанию: 0.3)'
        direction_id:
          type: integer
          nullable: true
        manager_email:
          type: string
          format: email
          nullable: true
          minLength: 1
        interview_type:
          type: string
          nullable: true
          minLength: 1
        status:
          type: string
          nullable: true
          minLength: 1
      required:
      - query
    SemanticSearchResponse:
      type: object
      description: Сериализатор ответа семантического поиска.
      properties:
        query:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/SemanticSearchResult'
        total_found:
          type: integer
        search_time_ms:
          type: number
          format: double
      required:
      - query
      - results
      - search_time_ms
      - total_found
    SemanticSearchResult:
      type: object
      description: Сериализатор результата семантического поиска.
      properties:
        entity_type:
          type: string
        entity_id:
          type: integer
        text_content:
          type: string
        similarity_score:
          type: number
          format: double
        metadata: {}
      required:
      - entity_id
      - entity_type
      - metadata
      - similarity_score
      - text_content
    SimilarEntitiesRequestRequest:
      type: object
      description: Сериализатор запроса для поиска похожих сущностей.
      properties:
        entity_type:
          allOf:
          - $ref: '#/components/schemas/EntityTypeEnum'
          description: |-
            Тип сущности

            * `interview` - interview
            * `intern` - intern
            * `offer` - offer
            * `debt` - debt
            * `sad_intern` - sad_intern
            * `manager` - manager
            * `company` - company
            * `direction` - direction
            * `intern_weekly_status` - intern_weekly_status
            * `kb_article` - kb_article
        entity_id:
          type: integer
          description: ID сущности
        top_k:
          type: integer
          maximum: 50
          minimum: 1
          default: 5
          description: Количество похожих результатов
      required:
      - entity_id
      - entity_type
    StatusEnum:
      enum:
      - rejected
      - accepted
      - offered
      - fired
      - on_project
      type: string
      description: |-
        * `rejected` - Отказ
        * `accepted` - Взяли
        * `offered` - Предложили
        * `fired` - Уволили
        * `on_project` - Вышел на проект
    TypeOfTrainingEnum:
      enum:
      - internal
      - outstaff
      - external
      - external_or_outstaff
      type: string
      description: |-
        * `internal` - Внутреннее обучение
        * `outstaff` - Аутстафф
        * `external` - Во вне
        * `external_or_outstaff` - Во вне / аутстафф
  securitySchemes:
    SessionAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Сессия локального входа.
    SessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
      description: Сессионная аутентификация (для браузера)
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
