      enum:
      - ''
    Company:
      type: object
      description: Список и детали компании; запись полей name, is_bigtech, aliases.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Название
          maxLength: 255
        is_bigtech:
          type: boolean
          title: Бигтех
        aliases:
          type: string
          title: Псевдонимы
          description: Варианты написания названия (по одному на строку). Используются
            при автоматическом импорте.
        aliases_list:
          type: array
