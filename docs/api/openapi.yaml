      parameters:
      - in: query
        name: direction_id
        schema:
          type: integer
      - in: query
        name: intern_id
        schema:
          type: integer
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: month
        schema:
          type: integer
      - in: query
        name: offset
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: year
        schema:
          type: integer
      tags:
      - Офферы
      security:
      - cookieAuth: []
      - SessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        year:
                          type: integer
                        month:
                          type: integer
                        total_count:
                          type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
                  has_more:
                    type: boolean
                  next_offset:
                    type: integer
                    nullable: true
          description: ''
