      description: |-
        Плоский список как на сайте: по умолчанию без `on_project`, без студентов со статусами «Оффер»/«Ушёл». Параметр `exclude_on_project=false` (или `0`, `no`) расширяет выдачу записями со статусом `on_project` (по-прежнему без студентов со статусами оффер/ушёл).

