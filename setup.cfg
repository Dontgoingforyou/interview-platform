[flake8]
max-line-length = 119
extend-ignore = E203, E266, E501, W503, F841
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .venv,
    venv,
    migrations,
    staticfiles,
    project/frontend,
    .poetry,
    .cache

[mypy]
python_version = 3.13
mypy_path = project
explicit_package_bases = True
plugins = mypy_django_plugin.main, mypy_drf_plugin.main
ignore_missing_imports = True
no_strict_optional = True
warn_unused_ignores = False
exclude = (?x)(
    migrations/
    | manage\.py
    | deploy/
    | project/core/settings\.py
    )

[mypy.plugins.django-stubs]
django_settings_module = core.settings

[mypy-*.migrations.*]
ignore_errors = True

[mypy-core.settings]
ignore_errors = True

[mypy-*.models]
disable_error_code = misc,arg-type

[mypy-interviews.admin]
disable_error_code = attr-defined

[mypy-core.date_utils]
ignore_missing_imports = True

[mypy-knowledge_base_app.managers]
ignore_missing_imports = True

[mypy-bleach]
ignore_missing_imports = True

[mypy-vector_search.*]
ignore_errors = True

[mypy-accounts.sso_client]
ignore_missing_imports = True
