events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    client_max_body_size 10240M;

    # Если перед nginx есть прокси с TLS, он передаёт X-Forwarded-Proto.
    # Без заголовка остаётся схема самого nginx.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    upstream django_backend {
        server web:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Статические файлы
        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Медиа файлы
        location /media/ {
            alias /usr/share/nginx/html/media/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Проксирование запросов к Django
        location / {
            proxy_pass http://django_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_redirect off;

            # Таймауты для долгих запросов (загрузка до 10 ГБ).
            # send/read timeout — между двумя последовательными операциями, не суммарное время.
            proxy_connect_timeout 75s;
            proxy_send_timeout 7200s;
            proxy_read_timeout 7200s;
            send_timeout 7200s;
        }
    }
}
